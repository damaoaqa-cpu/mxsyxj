name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mobile APK
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. Node.js
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ========================================
      # 3. Java
      # ========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================
      # 4. Android SDK
      # ========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      # ========================================
      # 5. Android SDK packages
      # ========================================
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # ========================================
      # 6. Android NDK
      # ========================================
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"

      # ========================================
      # 7. Install npm dependencies
      # ========================================
      - name: Install npm dependencies
        run: npm install

      # ========================================
      # 8. Check Capacitor
      # ========================================
      - name: Check Capacitor
        run: |
          echo "========== Capacitor =========="
          npx cap --version

          echo ""
          echo "========== Capacitor packages =========="
          npm list @capacitor/core @capacitor/cli @capacitor/android || true

      # ========================================
      # 9. Clean Android
      # ========================================
      - name: Clean Android project
        run: |
          rm -rf android
          echo "Android directory removed."

      # ========================================
      # 10. Add Android platform
      # ========================================
      - name: Add Android platform
        run: |
          npx cap add android

      # ========================================
      # 11. Generate Capacitor files
      # ========================================
      - name: Generate Capacitor Android files
        run: |
          echo "Checking generated Capacitor files..."

          if [ ! -f android/capacitor.settings.gradle ]; then
            echo "capacitor.settings.gradle was not generated."
            echo "Generating it manually..."

            cat > android/capacitor.settings.gradle <<'EOF'
            // Generated by GitHub Actions
            def capacitorAndroidDir = new File(
                rootDir,
                "../node_modules/@capacitor/android"
            )

            if (capacitorAndroidDir.exists()) {
                include ':capacitor-android'
                project(':capacitor-android').projectDir =
                    new File(capacitorAndroidDir, "capacitor")
            }
            EOF
          fi

          echo ""
          echo "========== capacitor.settings.gradle =========="
          cat android/capacitor.settings.gradle

      # ========================================
      # 12. Sync Capacitor
      # ========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ========================================
      # 13. Verify Android project
      # ========================================
      - name: Verify Android project
        run: |
          echo "========== Required files =========="

          test -f android/settings.gradle
          echo "OK: settings.gradle"

          test -f android/capacitor.settings.gradle
          echo "OK: capacitor.settings.gradle"

          test -f android/gradlew
          echo "OK: gradlew"

          test -f android/app/build.gradle
          echo "OK: app/build.gradle"

          echo ""
          echo "========== settings.gradle =========="
          cat android/settings.gradle

          echo ""
          echo "Android project verification passed."

      # ========================================
      # 14. Gradle
      # ========================================
      - name: Prepare Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ========================================
      # 15. Build Debug
      # ========================================
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ========================================
      # 16. Build Release
      # ========================================
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # ========================================
      # 17. Find APK
      # ========================================
      - name: Find APK
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find android/app/build/outputs \
            -name "*.apk" \
            -type f \
            -print

      # ========================================
      # 18. Upload Debug APK
      # ========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ========================================
      # 19. Upload Release APK
      # ========================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
